<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connect with Imad Ali Syed</title>
  <meta name="description" content="Save Imad Ali Syed's contact information and connect professionally." />
  <style>
    :root {
      --bg: #0b1020;
      --card: #121a2d;
      --text: #f7f9fc;
      --muted: #aeb8cc;
      --accent: #5aa9ff;
      --border: #26324d;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(circle at top, #182342 0, var(--bg) 55%);
      color: var(--text);
    }
    .card {
      width: 100%;
      max-width: 460px;
      background: rgba(18,26,45,.94);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 24px 80px rgba(0,0,0,.35);
    }
    .avatar {
      width: 88px; height: 88px; border-radius: 50%;
      display: grid; place-items: center;
      font-size: 30px; font-weight: 700;
      background: linear-gradient(135deg, #2d63ff, #6dc7ff);
      margin-bottom: 18px;
    }
    h1 { margin: 0 0 8px; font-size: 30px; }
    .subtitle { color: var(--muted); margin-bottom: 24px; line-height: 1.5; }
    .primary, .link {
      display: block; width: 100%; text-decoration: none;
      border-radius: 14px; padding: 15px 16px;
      margin-top: 12px; text-align: center; font-weight: 650;
    }
    .primary { background: var(--accent); color: #07101f; }
    .link { color: var(--text); border: 1px solid var(--border); background: #0f1729; }
    .small { margin-top: 20px; color: var(--muted); font-size: 13px; line-height: 1.5; text-align: center; }
  </style>
</head>
<body>
